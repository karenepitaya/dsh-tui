# DSH-TUI is the interactive coding surface over the shared dsh-base bundle.
- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# Module reload and terminal raw-mode ownership cannot safely overlap.
- id: hmr
  disabled: true

# DSH-TUI composes model-facing capabilities per Agent. Keep the official
# rc.2 host registries/providers in dsh-base, but disable the exact agent-plane
# rows that would otherwise leak into every preset scope.
- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-str-replace-editor
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

- insert:
    # Split composition rows form an inject-driven DAG. Loader starts sibling
    # rows concurrently, so their source order is chosen for safe teardown:
    # Product (terminal owner) stops before optional workspace consumers,
    # Adapter providers, the required legacy Feature, and Kernel.
    - id: dsh-tui
      name: dsh-tui/product

    # Forward row disposal mirrors the root owner's reverse-registration
    # order for optional workspaces.
    - id: dsh-tui-settings
      name: dsh-tui/features/settings

    - id: dsh-tui-mcp
      name: dsh-tui/features/mcp

    - id: dsh-tui-tools
      name: dsh-tui/features/tools

    - id: dsh-tui-skills
      name: dsh-tui/features/skills

    - id: dsh-tui-modes
      name: dsh-tui/features/modes

    - id: dsh-tui-models
      name: dsh-tui/features/models

    - id: dsh-tui-diff
      name: dsh-tui/features/diff

    - id: dsh-tui-sessions
      name: dsh-tui/features/sessions

    - id: dsh-tui-dsh-rc2
      name: dsh-tui/adapters/dsh-rc2

    - id: dsh-tui-legacy-chat
      name: dsh-tui/features/legacy-chat

    - id: dsh-tui-preferences
      name: dsh-tui/adapters/preferences

    - id: dsh-tui-kernel
      name: dsh-tui/adapters/cordis

    # Shipped code and cordis presets need these process-hosted providers.
    # OAuth and provider-native API-key conversations are registered here by
    # llm-pi-ai and rendered by the TUI's local /connect surface.
    - id: authorization
      name: '@deepseek-ai/dsh-authorization'

    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    # Sample the process clock at every eligible model step, including resume.
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'
      config:
        refreshIntervalMs: 0

    # The official launcher injects its version-matched shipped preset root;
    # AgentPresets appends the user root from DSH_HOME itself.
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard
